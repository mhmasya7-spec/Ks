
name: Build Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unzip project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 2 -type f -iname '*PlateHunter*.zip' ! -path './.github/*' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::No PlateHunter ZIP found in repository root."
            exit 1
          fi

          echo "Found archive: $ZIP"
          unzip -t "$ZIP"
          mkdir -p /tmp/proj
          unzip -q "$ZIP" -d /tmp/proj

          GRADLE_FILE="$(find /tmp/proj -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"

          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::Could not find Gradle settings file."
            find /tmp/proj -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlateHunter-debug-apk
          path: /tmp/proj/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
